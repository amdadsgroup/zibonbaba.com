services:
  - type: web
    name: zibonbaba-backend
    runtime: node
    plan: free
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: zibonbaba-db
          property: connectionString
      - key: JWT_SECRET
        value: zibonbaba_super_secure_jwt_session_secret_token_123
      - key: PORT
        value: 5000

databases:
  - name: zibonbaba-db
    plan: free
