version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: zibonbaba-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword2026
      POSTGRES_DB: zibonbaba
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: zibonbaba-backend
    restart: always
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword2026@db:5432/zibonbaba?schema=public"
      JWT_SECRET: "zibonbaba_super_secure_jwt_session_secret_token_123"
      PORT: 5000
    ports:
      - "5000:5000"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: zibonbaba-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:5000/api"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
